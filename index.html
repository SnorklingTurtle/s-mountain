<!doctype html>
<html>
  <head>
    <title>Server Status</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
      /*! minireset.css v0.0.6 | MIT License | github.com/jgthms/minireset.css */html,body,p,ol,ul,li,dl,dt,dd,blockquote,figure,fieldset,legend,textarea,pre,iframe,hr,h1,h2,h3,h4,h5,h6{margin:0;padding:0}h1,h2,h3,h4,h5,h6{font-size:100%;font-weight:normal}ul{list-style:none}button,input,select{margin:0}html{box-sizing:border-box}*,*::before,*::after{box-sizing:inherit}img,video{height:auto;max-width:100%}iframe{border:0}table{border-collapse:collapse;border-spacing:0}td,th{padding:0}
    </style>
    
    <style>
      .page { 
        background-color: darkgray; 
        height: 100vh;
      }
      .main {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100%;
      }
      .widget { display: none; }
      .loading {
          --color-1: rgba(255, 255, 255, 0.2);
          --color-2: #fff;
          --size: 1px;
      
          width: calc(160 * var(--size));
          height: calc(8 * var(--size));
          border-radius: calc(4 * var(--size));
          display: block;
          margin: calc(20 * var(--size)) auto;
          position: relative;
          background: var(--color-1);
          overflow: hidden;
          box-sizing: border-box;
      }
      
      .loading::after {
          content: '';
          position: absolute;
          top: 0;
          left: 0;
          height: 100%;
          width: calc(70 * var(--size));
          border-radius: inherit;
          background: var(--color-2);
          box-sizing: border-box;
          animation: slide 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      
      @keyframes slide {
          0% {
              transform: translateX(calc(-70 * var(--size)));
          }
      
          100% {
              transform: translateX(calc(160 * var(--size)));
          }
      }
    </style>
  </head>
  <body class="page">
    <main class="main">
    <span id="loading" class="loading"></span>
    <div id="widget" class="widget">
      <p><span id="players-online"></span> <span id="players-text"></span> online at <span id="server-name"></span></p>
      <img id="server-icon" alt="" />
    </div>
    </main>
  </body>
  <script>
    async function getServerStatus() {
      const url = "https://api.mcstatus.io/v2/status/java/91.99.208.172";
      let result;
      try {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`Response status: ${response.status}`);
        }
    
        result = await response.json();
        console.log(result);
      } catch (error) {
        console.error(error.message);
      }
      return result;
    }

    (async () => {
      let status = await getServerStatus();
      document.getElementById('loading').style.display = "none";
      document.getElementById('widget').style.display = "block";
      document.getElementById('server-name').innerText = status.motd.clean;
      document.getElementById('server-icon').src = status.icon;
      document.getElementById('players-online').innerText = status.players.online;
      document.getElementById('players-text').innerText = parseInt(status.players.online) === 1 ? "player" : "players";
    })();
  </script>
</html>
