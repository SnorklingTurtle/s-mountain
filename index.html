<!doctype html>
<html>
  <head>
    <title>The mountain</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
      body { background-color: darkgray; }
    </style>
  </head>
  <body>
    <p id="server-name">Loading...</p>
    <img id="server-icon" alt="">
    <p id="players-online">Loading...</p>
    
  </body>
  <script>
    async function getServerStatus() {
      const url = "https://api.mcstatus.io/v2/status/java/91.99.208.172";
      let response;
      try {
        response = await fetch(url);
        if (!response.ok) {
          throw new Error(`Response status: ${response.status}`);
        }
    
        const result = await response.json();
        console.log(result);
      } catch (error) {
        console.error(error.message);
      }
      return response;
    }
    let status = await getServerStatus();
    document.getElementById('server-name').innerText = status.motd.clean;
    document.getElementById('server-icon').src = status.icon;
    document.getElementById('players-online').innerText = status.players.online;
  </script>
</html>
